&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

  syncTheme();
})();

function builderPage(){const stages=[&#x27;Products&#x27;,&#x27;Design&#x27;,&#x27;Packaging&#x27;,&#x27;Review&#x27;];let content=&#x27;&#x27;;if(state.builderStep===0)content=`&lt;div class=&quot;builder&quot;&gt;&lt;h2&gt;Option C · make it yours&lt;/h2&gt;&lt;p class=&quot;muted small&quot;&gt;Drag products into your gift, or use Add. Your curated options stay intact.&lt;/p&gt;&lt;div class=&quot;catalogue&quot;&gt;${[[&#x27;Bottle&#x27;,&#x27;bottle-wine&#x27;],[&#x27;Dabara tumbler&#x27;,&#x27;coffee&#x27;],[&#x27;Framed art&#x27;,&#x27;frame&#x27;],[&#x27;T-shirt&#x27;,&#x27;shirt&#x27;],[&#x27;Magnet&#x27;,&#x27;magnet&#x27;]].map(([name,icon])=&gt;action(&#x27;add-product&#x27;,`&lt;i data-lucide=&quot;${icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${name} +`,&#x27;&#x27;,`data-value=&quot;${name}&quot; draggable=&quot;true&quot; data-drag-product=&quot;${name}&quot;`)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;tray&quot; data-drop&gt;${state.builderItems.length?state.builderItems.map((x,i)=&gt;`&lt;div class=&quot;item&quot;&gt;&lt;span&gt;${esc(x)} · 1 / recipient&lt;/span&gt;${action(&#x27;remove-product&#x27;,&#x27;Remove&#x27;,&#x27;&#x27;,`data-index=&quot;${i}&quot;`)}&lt;/div&gt;`).join(&#x27;&#x27;):&#x27;Your gift starts here. Add something above.&#x27;}&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;Keep a little aside for packaging. It depends on the size and presentation; delivery is at actuals.&lt;/p&gt;&lt;label style=&quot;margin-top:14px&quot;&gt;Want a little something more?&lt;input data-builder-field=&quot;extra&quot; value=&quot;${esc(state.builderExtra||&#x27;&#x27;)}&quot; placeholder=&quot;Something worth about ₹50 more per gift&quot;&gt;&lt;/label&gt;&lt;/div&gt;`;if(state.builderStep===1)content=panel(&#x27;The story on the gift.&#x27;,`&lt;label&gt;Design direction&lt;select data-builder-field=&quot;design&quot;&gt;${[&#x27;One shared custom design&#x27;,&#x27;Existing Aarla artwork&#x27;,&#x27;Help me choose&#x27;]. function momentsPage(){const g=gift();if(!g.delivered)return giftHead(&#x27;moments&#x27;)+panel(&#x27;The best part is still to come.&#x27;,`&lt;p class=&quot;muted&quot;&gt;Once their gifts arrive, keep photos of the handover, the celebration or the gifts being enjoyed.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${btn(&#x27;delivery&#x27;,&#x27;Track the gift →&#x27;,&#x27;primary&#x27;)}&lt;/div&gt;`);return giftHead(&#x27;moments&#x27;)+heading(&#x27;The gift is theirs. The memories are yours.&#x27;,&#x27;A place for the little moments after delivery.&#x27;)+`&lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;How did it feel?&lt;/h2&gt;${gift().review?`&lt;span class=&quot;badge&quot;&gt;Feedback saved&lt;/span&gt;&lt;p&gt;${&#x27;★&#x27;.repeat(gift().review.rating)} · ${esc(gift().review.text)}&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;${gift().review.public?&#x27;Permission given for Aarla to feature the testimonial.&#x27;:&#x27;Private feedback for the Aarla team.&#x27;}&lt;/p&gt;${btn(&#x27;review&#x27;,&#x27;Edit feedback →&#x27;,&#x27;link&#x27;)}`:`&lt;p class=&quot;muted&quot;&gt;Did the gift feel like them? Tell us what worked and what we can do better.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${btn(&#x27;review&#x27;,&#x27;Share your experience&#x27;,&#x27;primary&#x27;)}&lt;/div&gt;`}&lt;/section&gt;${panel(&#x27;Caught a lovely moment?&#x27;,`&lt;p class=&quot;muted&quot;&gt;The unwrapping, a room full of gifts or someone making it part of their day.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${btn(&#x27;addPhotos&#x27;,&#x27;+ Add photos&#x27;,&#x27;olive&#x27;)}&lt;/div&gt;${note(&#x27;Private to you and the Aarla team. Public featuring needs a separate permission.&#x27;)}`)}&lt;/div&gt;&lt;section class=&quot;panel below&quot;&gt;&lt;div class=&quot;optionhead&quot;&gt;&lt;h2&gt;Your moments&lt;/h2&gt;&lt;span class=&quot;small muted&quot;&gt;${gift().photos.length||1} ${gift().photos.length===1?&#x function reviewPage(){return giftHead(&#x27;moments&#x27;)+heading(&#x27;Tell us how it went.&#x27;,&#x27;Your feedback helps us make the next gift better.&#x27;)+`&lt;form data-form=&quot;review&quot; class=&quot;panel&quot; style=&quot;max-width:700px&quot;&gt;&lt;label&gt;How was your gifting experience?&lt;/label&gt;&lt;div class=&quot;stars&quot; aria-label=&quot;Rating&quot;&gt;${[1,2,3,4,5].map(n=&gt;action(&#x27;rating&#x27;,&#x27;★&#x27;,&#x27;&#x27;,`data-value=&quot;${n}&quot; aria-label=&quot;${n} star${n===1?&#x27;&#x27;:&#x27;s&#x27;}&quot; aria-pressed=&quot;${n&lt;=state.rating}&quot;`)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;label&gt;Your experience&lt;textarea rows=&quot;4&quot; name=&quot;text&quot; required placeholder=&quot;What did they love? Anything we could have done better?&quot;&gt;${esc(gift().review?.text||&#x27;&#x27;)}&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;check&quot;&gt;&lt;input name=&quot;publish&quot; type=&quot;checkbox&quot; ${gift().review?.public?&#x27;checked&#x27;:&#x27;&#x27;}&gt;Aarla may feature this testimonial publicly with my first name.&lt;/label&gt;&lt;p class=&quot;small muted&quot;&gt;Optional. Your feedback reaches the team either way. Photo permission is separate.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${submit(&#x27;Send feedback&#x27;)}${btn(&#x27;moments&#x27;,&#x27;Back&#x27;)}&lt;/div&gt;${feedback}&lt;/form&gt;`;}

function messagesPage(){const g=gift();return giftHead(&#x27;messages&#x27;)+`&lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;Talk to Aarla&lt;/h2&gt;${g.messages.map(x=&gt;`&lt;article class=&quot;message&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;${esc(x.who)}&lt;/span&gt;&lt;p&gt;${esc(x.text)}&lt;/p&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;form data-form=&quot;message&quot; style=&quot;margin-top:14px&quot;&gt;&lt;label&gt;Message&lt;textarea name=&quot;message&quot; rows=&quot;3&quot; required placeholder=&quot;Ask a question, share a thought or request a change.&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label style=&quot;margin-top:10px&quot;&gt;Attachment · optional&lt;input name=&quot;attachment&quot; type=&quot;file&quot; accept=&quot;image/*,.pdf&quot;&gt;&lt;/label&gt;&lt;div class=&quot;actions&quot;&gt;${submit(&#x27;Send message&#x27;)}&lt;/div&gt;${feedback}&lt;/form&gt;&lt;/section&gt;${panel(&#x27;About this gift&#x27;,`&lt;p&gt;${esc(g.title)}&lt;/p&gt;&lt;p class=&quot;muted small&quot;&gt;${esc(g.recipient)} · ${esc(g.stage)}&lt;/p&gt;${btn(&#x27;activity&#x27;,&#x27;View activity →&#x27;,&#x27;link&#x27;)}`)}&lt;/div&gt;`;}

function occasionsPage(){const rows=occasions.filter(o=&gt;(o.name+&#x27; &#x27;+o.circle).toLowerCase().includes(state.occasionQuery.toLowerCase()));return heading(&#x27;Occasions&#x27;,&#x27;The people and moments you want to remember.&#x27;,action(&#x27;new-occasion&#x27;,&#x27;+ Add occasion&#x27;,&#x27;primary&#x27;))+`&lt;div class=&quot;toolbar&quot;&gt;&lt;label class=&quot;search&quot;&gt;Find an occasion&lt;input type=&quot;search&quot; data-occasion-search value=&quot;${esc(state.occasionQuery)}&quot; placeholder=&quot;A person, birthday or celebration&quot;&gt;&lt;/label&gt;&lt;div class=&quot;actions&quot;&gt;${btn(&#x27;people&#x27;,&#x27;Your people →&#x27;,&#x27;olive&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div data-occasion-results&gt;${occasionRows(rows)}&lt;/div&gt;`;}

function occasionDetail(){const o=occasion(),p=people.find(x=&gt;x.id===o.personId),past=gifts.filter(g=&gt;g.occasionId===o.id&amp;&amp;g.date.slice(0,4)&lt;o.date.slice(0,4)),current=gifts.find(g=&gt;g.occasionId===o.id&amp;&amp;g.date.startsWith(&#x27;2026&#x27;));return occasionHead()+`&lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;nexttask&quot;&gt;&lt;span class=&quot;badge attention&quot;&gt;Coming up · ${dateText(o.date)}&lt;/span&gt;&lt;h2&gt;${current?&#x27;This year’s gift is underway.&#x27;:&#x27;What would feel like them this year?&#x27;}&lt;/h2&gt;&lt;p&gt;${current?esc(current.title):esc(o.note)}&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${current?action(&#x27;open-gift&#x27;,&#x27;Open this year’s gift →&#x27;,&#x27;primary&#x27;,`data-id=&quot;${current.id}&quot;`):action(&#x27;gift-from-occasion&#x27;,&#x27;Create a gift for this occasion →&#x27;,&#x27;primary&#x27;)}&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;The occasion and recipient carry into your brief. You can change anything before sending.&lt;/p&gt;&lt;/section&gt;${panel(p?&#x27;A little about &#x27;+esc(p.name):&#x27;The people behind the occasion&#x27;,p?`&lt;div class=&quot;chips&quot;&gt;${p.likes.split(&#x27;,&#x27;).map(x=&gt;&#x27;&lt;span class=&quot;chip&quot;&gt;&#x27;+esc(x.trim())+&#x27;&lt;/span&gt;&#x27;).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;${esc(p.sharedAbout||p.about)}&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${btn(&#x27;person&#x27;,&#x27;View recipient →&#x27;,&#x27;olive&#x27;,`data-person-id=&quot;${p.id}&quot;`)}&lt;/div&gt;`:`&lt;p&gt;Add people and a little about them whenever you’re ready.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${btn(&#x27;editOccasion&#x27;,&#x27;Add recipients&#x27;,&#x27;olive&#x27;)}&lt;/div&gt;`)}&lt;/div&gt;&lt;section class=&quot;panel below&quot;&gt;&lt;div class=&quot;optionhead&quot;&gt;&lt;h2&gt;Last time, you made it personal.&lt;/h2&gt;${btn(&#x27;occasionHistory&#x27;,&#x27;All pre function occasionHistory(){const o=occasion(),past=gifts.filter(g=&gt;g.occasionId===o.id&amp;&amp;g.date.slice(0,4)&lt;o.date.slice(0,4));return occasionHead()+heading(&#x27;The years, remembered.&#x27;,&#x27;Gifts, notes and moments attached to this occasion.&#x27;)+`&lt;div class=&quot;stack&quot;&gt;${past.length?past.map(g=&gt;panel(g.date.slice(0,4),`&lt;div class=&quot;historyrow&quot; style=&quot;margin-top:0&quot;&gt;${image(g.image,&#x27;Illustrative previous-year gift reference&#x27;)}&lt;div&gt;&lt;h3&gt;${esc(g.title)}&lt;/h3&gt;&lt;p&gt;${esc(g.brief)}&lt;/p&gt;&lt;p class=&quot;small muted&quot;&gt;${g.people} recipient · ${esc(g.tracking||&#x27;Brief received&#x27;)}&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${action(&#x27;open-gift&#x27;,&#x27;Open gift →&#x27;,&#x27;olive&#x27;,`data-id=&quot;${g.id}&quot;`)}${action(&#x27;open-gift&#x27;,&#x27;Photos &amp; feedback →&#x27;,&#x27;link&#x27;,`data-id=&quot;${g.id}&quot; data-target=&quot;moments&quot;`)}${action(&#x27;repeat-gift&#x27;,&#x27;Build on last year →&#x27;,&#x27;primary&#x27;,`data-id=&quot;${g.id}&quot;`)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`)).join(&#x27;&#x27;):panel(&#x27;A story starts somewhere.&#x27;,&#x27;&lt;p&gt;No gifts linked yet. Start this year’s gift and it will stay connected here.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&#x27;+action(&#x27;gift-from-occasion&#x27;,&#x27;Create a gift&#x27;,&#x27;primary&#x27;)+&#x27;&lt;/div&gt;&#x27;)}&lt;/div&gt;`;}

function peoplePage(){return heading(&#x27;Your people&#x27;,&#x27;A few thoughtful notes make a difference next time.&#x27;,action(&#x27;new-person&#x27;,&#x27;+ Add a person&#x27;,&#x27;primary&#x27;))+`&lt;div class=&quot;stack&quot;&gt;${people.map(p=&gt;`&lt;article class=&quot;occasionrow&quot;&gt;&lt;div class=&quot;lettertile&quot; style=&quot;width:58px;height:58px&quot;&gt;${p.photo?`&lt;img src=&quot;${p.photo}&quot; alt=&quot;${esc(p.name)}&quot; style=&quot;width:100%;height:100%;object-fit:cover;border-radius:8px&quot;&gt;`:esc(p.name.slice(0,2).toUpperCase())}&lt;/div&gt;&lt;div&gt;&lt;h2&gt;${esc(p.name)}&lt;/h2&gt;&lt;p class=&quot;small muted&quot;&gt;${esc(p.relationship)} · ${p.sharedAbout?&#x27;Profile shared&#x27;:p.id===&#x27;p1&#x27;&amp;&amp;state.inviteSent?&#x27;Invitation prepared&#x27;:&#x27;Your private notes&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;${btn(&#x27;person&#x27;,&#x27;View person →&#x27;,&#x27;olive&#x27;,`data-person-id=&quot;${p.id}&quot;`)}&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${note(&#x27;People do not need an account to be in your private recipient list. They choose what to share if invited.&#x27;)}`;}
function personHeader(){const p=person();return btn(&#x27;people&#x27;,&#x27;← Your people&#x27;,&#x27;link back&#x27;)+`&lt;div class=&quot;personheader&quot;&gt;&lt;div class=&quot;portrait&quot;&gt;${p.photo?`&lt;img src=&quot;${p.photo}&quot; alt=&quot;${esc(p.name)}&quot;&gt;`:esc(p.name.slice(0,2).toUpperCase())}&lt;/div&gt;&lt;div&gt;&lt;h1&gt;${esc(p.name)}&lt;/h1&gt;&lt;p class=&quot;muted&quot;&gt;${esc(p.relationship)}&lt;/p&gt;&lt;div class=&quot;actions&quot; style=&quot;margin-top:8px&quot;&gt;${btn(&#x27;editPerson&#x27;,&#x27;Edit your notes&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;}

27;occasion&#x27;,&#x27;Open occasion →&#x27;,&#x27;link&#x27;,`data-occasion-id=&quot;${o.id}&quot;`)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)||&#x27;&lt;p class=&quot;muted&quot;&gt;No occasion saved yet.&lt;/p&gt;&#x27;}&lt;div class=&quot;actions&quot;&gt;${action(&#x27;new-occasion&#x27;,&#x27;+ Add an occasion&#x27;,&#x27;olive&#x27;)}&lt;/div&gt;`)}${panel(&#x27;Make something feel like them.&#x27;,`&lt;p class=&quot;muted&quot;&gt;Start from what you know. We’ll help with the gifting.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${action(&#x27;gift-from-person&#x27;,&#x27;Create a gift →&#x27;,&#x27;primary&#x27;)}&lt;/div&gt;`)}&lt;/div&gt;&lt;/div&gt;`;}
function editPerson(){const p=state.newPerson?{name:&#x27;&#x27;,relationship:&#x27;Friend&#x27;,about:&#x27;&#x27;,likes:&#x27;&#x27;,avoid:&#x27;&#x27;,email:&#x27;&#x27;}:person();return btn(state.newPerson?&#x27;people&#x27;:&#x27;person&#x27;,&#x27;← Back&#x27;,&#x27;link back&#x27;)+heading(state.newPerson?&#x27;Who are you thinking of?&#x27;:&#x27;Your notes about &#x27;+p.name,&#x27;Start with a name. Everything else is optional.&#x27;)+`&lt;form class=&quot;panel&quot; data-form=&quot;person&quot;&gt;&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;Name&lt;input name=&quot;name&quot; value=&quot;${esc(p.name)}&quot; required placeholder=&quot;A name or what you call them&quot;&gt;&lt;/label&gt;&lt;label&gt;Your relationship&lt;input name=&quot;relationship&quot; value=&quot;${esc(p.relationship)}&quot; placeholder=&quot;Friend, mother, colleague…&quot;&gt;&lt;/label&gt;&lt;label class=&quot;full&quot;&gt;A little about them&lt;textarea name=&quot;about&quot; rows=&quot;3&quot; placeholder=&quot;Their rituals, their little joys, what makes them them.&quot;&gt;${esc(p.about)}&lt;/textarea&gt;&lt;/label&gt;&lt;label&gt;Likes &amp; interests&lt;input name=&quot;likes&quot; value=&quot;${esc(p.likes)}&quot; placeholder=&quot;Coffee, music, gardening&quot;&gt;&lt;/label&gt;&lt;label&gt;Anything to avoid&lt;input name=&quot;avoid&quot; value=&quot;${esc(p.avoid)}&quot; placeholder=&quot;Strong fragrance, disposable packaging&quot;&gt;&lt;/label&gt;&lt;label&gt;Photo · optional&lt;input name=&quot;photo&quot; type=&quot;file&quot; accept=&quot;image/png,image/jpeg,image/webp&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;${submit(&#x27;Save person&#x27;)}${btn(&#x27;people&#x27;,&#x27;Cancel&#x27;)}&lt;/div&gt;${note(&#x27;These are your private notes. No account or invitation is created automatically.&#x27;)}&lt;/form&gt;`;}
function invitationPage(){const p=person();return personHeader()+heading(&#x27;Let them tell their own story.&#x27;,&#x27;Invite &#x27;+p.name+&#x27; to share only what they’re comfortable sharing.&#x27;)+`&lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;form data-form=&quot;invite&quot;&gt;&lt;label&gt;Their email&lt;input type=&quot;email&quot; name=&quot;email&quot; value=&quot;${esc(p.email)}&quot; placeholder=&quot;Their email address&quot; required&gt;&lt;/label&gt;&lt;label style=&quot;margin-top:12px&quot;&gt;A personal note&lt;textarea name=&quot;note&quot; rows=&quot;3&quot;&gt;I’d love to know what you enjoy, so the next little gift feels more like you.&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;actions&quot;&gt;${submit(state.inviteSent?&#x27;Update invitation preview&#x27;:&#x27;Prepare invitation&#x27;)}&lt;/div&gt;${feedback}${note(&#x27;Your private notes are never included. This design preview sends no email.&#x27;)}&lt;/form&gt;&lt;/section&gt;${panel(&#x27;What they’ll receive&#x27;,`&lt;h3&gt;Ananya wants to make the next gift feel like you.&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;A short invitation to write about yourself, share a few interests and choose who can see them.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${btn(&#x27;inviteLanding&#x27;,&#x27;Preview recipient’s experience →&#x27;,&#x27;olive&#x27;)}&lt;/div&gt;`)}&lt;/div&gt;`;}
function invitationLanding(){const p=person();return heading(&#x27;A little more you.&#x27;,&#x27;Ananya invited you to share what makes a gift feel like you.&#x27;)+`&lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Recipient view · invitation preview&lt;/span&gt;&lt;form data-form=&quot;accept-invite&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;Your name&lt;input name=&quot;name&quot; value=&quot;${esc(p.name)}&quot; required&gt;&lt;/label&gt;&lt;label&gt;Your email&lt;input type=&quot;email&quot; name=&quot;email&quot; value=&quot;${esc(p.email||&#x27;recipient@example.test&#x27;)}&quot; required&gt;&lt;/label&gt;&lt;label class=&quot;full&quot;&gt;About you&lt;textarea name=&quot;about&quot; rows=&quot;3&quot; placeholder=&quot;Your rituals, hobbies and the little things you love.&quot; required&gt;${esc(p.sharedAbout)}&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;full&quot;&gt;Your interests&lt;input name=&quot;likes&quot; value=&quot;${esc(p.sharedLikes)}&quot; placeholder=&quot;Music, coffee, art, books…&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;share&quot; required&gt;Share these details with Ananya. I can edit or withdraw them later.&lt;/label&gt;&lt;p class=&quot;small muted&quot;&gt;In the live app, accept using your own verified account. You can keep these details for yourself instead of sharing.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${submit(&#x27;Accept &amp; share with Ananya&#x27;)}${action(&#x27;decline-invite&#x27;,&#x27;Decline&#x27;,&#x27;&#x27;)}&lt;/div&gt;${feedback}&lt;/form&gt;&lt;/section&gt;${panel(&#x27;Your profile belongs to you.&#x27;,`&lt;p&gt;Write once, update whenever you like.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Your own GYVFT account starts with you. Joining family, work or other circles stays optional.&lt;/p&gt;${note(&#x27;Ananya’s private notes about you are not part of this invitation or your profile.&#x27;)}`)}&lt;/div&gt;`;}
function profilePage(){return heading(&#x27;A little about you.&#x27;,&#x27;Let the people gifting you get to know the little things.&#x27;,btn(&#x27;people&#x27;,&#x27;Your people →&#x27;,&#x27;olive&#x27;))+`&lt;div class=&quot;personheader&quot;&gt;&lt;div class=&quot;portrait&quot;&gt;AR&lt;/div&gt;&lt;div&gt;&lt;h2&gt;Ananya Raman&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;ananya@example.test&lt;/p&gt;&lt;span class=&quot;badge&quot;&gt;Individual account · circles optional&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;Your own words&lt;/h2&gt;&lt;form data-form=&quot;self-profile&quot;&gt;&lt;label&gt;About me&lt;textarea name=&quot;about&quot; rows=&quot;3&quot; placeholder=&quot;What do you enjoy? What’s your ideal little gift?&quot;&gt;${esc(state.selfAbout||&#x27;I love useful things with a story, handmade objects and time with my people.&#x27;)}&lt;/textarea&gt;&lt;/label&gt;&lt;label style=&quot;margin-top:12px&quot;&gt;My interests&lt;input name=&quot;interests&quot; value=&quot;${esc(state.ownInterests.join(&#x27;, &#x27;))}&quot;&gt;&lt;/label&gt;&lt;label style=&quot;margin-top:12px&quot;&gt;My birthday · optional&lt;input name=&quot;birthday&quot; type=&quot;date&quot; value=&quot;${state.selfBirthday||&#x27;&#x27;}&quot;&gt;&lt;/label&gt;&lt;label class=&quot;check&quot;&gt;&lt;input name=&quot;share&quot; type=&quot;checkbox&quot; ${state.selfShare?&#x27;checked&#x27;:&#x27;&#x27;}&gt;Share my profile with people I accept into my circle.&lt;/label&gt;&lt;div class=&quot;actions&quot;&gt;${submit(&#x27;Save my profile&#x27;)}&lt;/div&gt;${feedback}&lt;/form&gt;${note(&#x27;Private by default. Your gifting activity and spending are not shared with your circle.&#x27;)}&lt;/section&gt;&lt;div class=&quot;stack&quot;&gt;${panel(&#x27;Does this sound like you?&#x27;,`&lt;p class=&quot;muted&quot;&gt;Your choices can give us clues, but a gift for someone else isn’t automatically your function tastePage(){return btn(&#x27;profile&#x27;,&#x27;← About me&#x27;,&#x27;link back&#x27;)+heading(&#x27;A clue. Not a conclusion.&#x27;,&#x27;You decide what becomes part of your taste profile.&#x27;)+`&lt;div class=&quot;two&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;span class=&quot;badge&quot;&gt;Suggested · not added to your profile&lt;/span&gt;&lt;h2 style=&quot;margin-top:12px&quot;&gt;Useful, everyday objects&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;You chose practical gift sets in two gifting examples.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Those gifts were for other people. Do you enjoy useful objects yourself?&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;${action(&#x27;accept-taste&#x27;,&#x27;Yes, that’s me&#x27;,&#x27;primary&#x27;)}${action(&#x27;reject-taste&#x27;,&#x27;That was for the recipient&#x27;,&#x27;&#x27;)}&lt;/div&gt;${state.suggestion?`&lt;p class=&quot;result&quot;&gt;${state.suggestion===&#x27;accepted&#x27;?&#x27;Added to your confirmed tastes.&#x27;:&#x27;Dismissed. We won’t treat this as your preference.&#x27;}&lt;/p&gt;`:&#x27;&#x27;}${note(&#x27;Proposed recommendation experience. This preview uses sample evidence; no model has analysed live customer data.&#x27;)}&lt;/section&gt;${panel(&#x27;What you’ve confirmed&#x27;,`&lt;div class=&quot;chips&quot;&gt;${state.ownInterests.map(x=&gt;`&lt;span class=&quot;chip&quot;&gt;${esc(x)}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${btn(&#x27;profile&#x27;,&#x27;Edit or remove interests →&#x27;,&#x27;link&#x27;)}`)}&lt;/div&gt;`;}
const opTabs=[[&#x27;opsRequest&#x27;,&#x27;Overview&#x27;],[&#x27;opsBrief&#x27;,&#x27;Brief&#x27;],[&#x27;opsOptions&#x27;,&#x27;Options&#x27;],[&#x27;opsQuote&#x27;,&#x27;Quote&#x27;],[&#x27;opsArtwork&#x27;,&#x27;Artwork&#x27;],[&#x27;verify&#x27;,&#x27;Payments&#x27;],[&#x27;opsOrder&#x27;,&#x27;Order&#x27;],[&#x27;opsConversation&#x27;,&#x27;Messages&#x27;],[&#x27;opsAudit&#x27;,&#x27;Activity&#x27;]];
function opHead(page){const g=gift();return btn(&#x27;worklist&#x27;,&#x27;← Requests &amp; orders&#x27;,&#x27;link back&#x27;)+heading(g.title,&#x27;Ananya Raman · ananya@example.test&#x27;,`&lt;span class=&quot;badge attention&quot;&gt;${esc(g.stage)}&lt;/span&gt;`)+`&lt;nav class=&quot;gift-tabs&quot; aria-label=&quot;Operations request sections&quot;&gt;${opTabs.map(([id,name])=&gt;btn(id,name,&#x27;&#x27;,`aria-current=&quot;${page===id?&#x27;page&#x27;:&#x27;false&#x27;}&quot;`)).join(&#x27;&#x27;)}&lt;/nav&gt;&lt;label class=&quot;mobile-section&quot;&gt;Request section&lt;select data-gift-tab&gt;${opTabs.map(([id,name])=&gt;`&lt;option value=&quot;${id}&quot; ${id===page?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${name}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;`;}
